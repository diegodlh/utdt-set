    <script>

		var innerWidth_max = window.innerWidth
		var innerHeight_max = window.innerHeight

		var onresizeFunction = function ( event ) {
			window.onresize = null
			// window.removeEventListener('resize', onresizeFunction)
			var innerWidth_new = window.innerWidth
			var innerHeight_new = window.innerHeight
			if (innerWidth_new < innerWidth_max || innerHeight_new < innerHeight_max) {
				// while(true) {
				// 	var clave = window.prompt('Por favor, reingrese al modo pantalla completa (F11) y luego ingrese la clave para continuar.')
				// 	if (clave == 'continuar') { break }
				// }
			}
			innerWidth_max = Math.max(innerWidth_max, innerWidth_new)
			innerHeight_max = Math.max(innerHeight_max, innerHeight_new)
			window.onresize = onresizeFunction
		}

		window.onresize = onresizeFunction

		window.onbeforeunload = function ( event ) {
			// while (true) {
			// 	var t0 = Date.now()
			// 	var clave = window.prompt('Ingrese la clave para salir:')
			// 	if (Date.now() - t0 < 100) {
			// 		break
			// 	} else if (clave == 'salir') {
			// 		break
			// 	}
			// }
			saveData(false)
			var clave = window.alert()
			// Cancel the event as stated by the standard.
			event.preventDefault();
			// Chrome requires returnValue to be set.
			event.returnValue = '';
		}

		var saveData = function(async) {
			var basename = uid.toString().padStart(3, '0') + mode + jsPsych.startTime().toISOString()
			sendData('data_' + basename, jsPsych.data.get().ignore('stimulus').csv())
			sendData('intdata_' + basename, jsPsych.data.getInteractionData().csv())
		}

		window.mobilecheck = function() {
			// https://stackoverflow.com/questions/11381673/detecting-a-mobile-browser
			var check = false;
			(function(a){if(/(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge |maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino/i.test(a)||/1207|6310|6590|3gso|4thp|50[1-6]i|770s|802s|a wa|abac|ac(er|oo|s\-)|ai(ko|rn)|al(av|ca|co)|amoi|an(ex|ny|yw)|aptu|ar(ch|go)|as(te|us)|attw|au(di|\-m|r |s )|avan|be(ck|ll|nq)|bi(lb|rd)|bl(ac|az)|br(e|v)w|bumb|bw\-(n|u)|c55\/|capi|ccwa|cdm\-|cell|chtm|cldc|cmd\-|co(mp|nd)|craw|da(it|ll|ng)|dbte|dc\-s|devi|dica|dmob|do(c|p)o|ds(12|\-d)|el(49|ai)|em(l2|ul)|er(ic|k0)|esl8|ez([4-7]0|os|wa|ze)|fetc|fly(\-|_)|g1 u|g560|gene|gf\-5|g\-mo|go(\.w|od)|gr(ad|un)|haie|hcit|hd\-(m|p|t)|hei\-|hi(pt|ta)|hp( i|ip)|hs\-c|ht(c(\-| |_|a|g|p|s|t)|tp)|hu(aw|tc)|i\-(20|go|ma)|i230|iac( |\-|\/)|ibro|idea|ig01|ikom|im1k|inno|ipaq|iris|ja(t|v)a|jbro|jemu|jigs|kddi|keji|kgt( |\/)|klon|kpt |kwc\-|kyo(c|k)|le(no|xi)|lg( g|\/(k|l|u)|50|54|\-[a-w])|libw|lynx|m1\-w|m3ga|m50\/|ma(te|ui|xo)|mc(01|21|ca)|m\-cr|me(rc|ri)|mi(o8|oa|ts)|mmef|mo(01|02|bi|de|do|t(\-| |o|v)|zz)|mt(50|p1|v )|mwbp|mywa|n10[0-2]|n20[2-3]|n30(0|2)|n50(0|2|5)|n7(0(0|1)|10)|ne((c|m)\-|on|tf|wf|wg|wt)|nok(6|i)|nzph|o2im|op(ti|wv)|oran|owg1|p800|pan(a|d|t)|pdxg|pg(13|\-([1-8]|c))|phil|pire|pl(ay|uc)|pn\-2|po(ck|rt|se)|prox|psio|pt\-g|qa\-a|qc(07|12|21|32|60|\-[2-7]|i\-)|qtek|r380|r600|raks|rim9|ro(ve|zo)|s55\/|sa(ge|ma|mm|ms|ny|va)|sc(01|h\-|oo|p\-)|sdk\/|se(c(\-|0|1)|47|mc|nd|ri)|sgh\-|shar|sie(\-|m)|sk\-0|sl(45|id)|sm(al|ar|b3|it|t5)|so(ft|ny)|sp(01|h\-|v\-|v )|sy(01|mb)|t2(18|50)|t6(00|10|18)|ta(gt|lk)|tcl\-|tdg\-|tel(i|m)|tim\-|t\-mo|to(pl|sh)|ts(70|m\-|m3|m5)|tx\-9|up(\.b|g1|si)|utst|v400|v750|veri|vi(rg|te)|vk(40|5[0-3]|\-v)|vm40|voda|vulc|vx(52|53|60|61|70|80|81|83|85|98)|w3c(\-| )|webc|whit|wi(g |nc|nw)|wmlb|wonu|x700|yas\-|your|zeto|zte\-/i.test(a.substr(0,4))) check = true;})(navigator.userAgent||navigator.vendor||window.opera);
			return check;
		};

		var keydown = function(keychar) {
			if (window.mobilecheck()) {
				var e = new Event("keydown")
				e.keyCode=jsPsych.pluginAPI.convertKeyCharacterToKeyCode(keychar)
				document.body.dispatchEvent(e)
				var e = new Event("keyup")
				e.keyCode=jsPsych.pluginAPI.convertKeyCharacterToKeyCode(keychar)
				document.body.dispatchEvent(e)
			}
		}

		document.body.addEventListener("click", function(e) {console.log(e.keyCode)})

    	var uid = 1
		var mode = 'test'
		
  //   	modes = ['test', 'retest']

  //   	while (true) {
  //   		var uid = window.prompt('uid:', '')
  //   		if (stimuli[uid-1]) { break; }
		// }

		// while (true) {
		// 	var mode = modes[window.prompt('1 (test) / 2 (retest):', '') - 1]
		// 	if (mode in stimuli[uid-1]) { break; }
		// }

		var trials = stimuli[uid-1][mode]
		// var trials = [trials[0]]

		var score = 0
		var trial_num = 0

		var audio_correct = new Audio('sounds/correct.mp3')
		var audio_wrong = new Audio('sounds/wrong.mp3')
		var audio_win = new Audio('sounds/win.mp3')

    	var fullscreen_on = {
			type: 'fullscreen',
			fullscreen_mode: true,
			data: {},
			delay_after: 0
		}

		var fullscreen_off = {
			type: 'fullscreen',
			fullscreen_mode: false,
			data: {}
		}

		var hold = {
			type: 'html-keyboard-response',
			stimulus: `
				<p style="background-color:#AAA;height:100vh;width:100vw;font-size:75vh;margin:0;display:table-cell;vertical-align:middle">
					${uid.toString().padStart(3, '0')}
				</p>
				`,
			choices: ['enter'],
			data: {}
		}

		var instructions = {
			type: 'instructions',
			pages: ['page 1',
					'page 2',
					'page 3',
					'Fin de las instrucciones. Siguiente para comenzar. Anterior para regresar.'],
			allow_keys: true,  // todo: bug: previous button is not ungreyed when page 2 is displayed
			allow_backward: true,
			show_clickable_nav: true,
			button_label_previous: 'Anterior',  // todo: can't an image be used instead?
			button_label_next: 'Siguiente'
		}

		var cards = {
			type: 'html-keyboard-response',
			stimulus: function() {
				trial_num += 1
				return makeHTML({cards: jsPsych.timelineVariable('cards', true), score:score, max_score:trials.length, uid:uid, trial_num:trial_num})
			},
			choices: [keychars.set, keychars.noset],  // todo: the problem is that if pause or abort keys are pressed, this part is over
			data: { trial_part: 'cards'},
			on_finish: function(data) {
				data.set = jsPsych.timelineVariable('type', true) >= 0
				if(data.set) {
					var correct_key = keychars.set
				} else {
					var correct_key = keychars.noset
				}
				data.correct = data.key_press == jsPsych.pluginAPI.convertKeyCharacterToKeyCode(correct_key);
				data.response = data.key_press == jsPsych.pluginAPI.convertKeyCharacterToKeyCode(keychars.set) ? 'set' : 'noset'
			}
		}

		var explanation = {
			type: 'html-keyboard-response',
			stimulus: function() {
				var response = jsPsych.data.get().filter({trial_part: 'cards'}).last(1).values()[0].response				
				return makeHTML({cards: jsPsych.timelineVariable('cards', true), response: response, explain: 'ask',
					score: score, max_score: trials.length, uid:uid, trial_num:trial_num})
			},
			choices: [keychars.explain, keychars.noexplain],
			data: { trial_part: 'decision' },
			on_finish: function(data) {
				data.explain = data.key_press == jsPsych.pluginAPI.convertKeyCharacterToKeyCode(keychars.explain)
				score = jsPsych.data.get().select('correct').sum()
			}
		}

		var feedback = {
			type: 'html-keyboard-response',
			stimulus: function() {
				var correct = jsPsych.data.get().filter({trial_part: 'cards'}).last(1).values()[0].correct
				var explain = jsPsych.data.get().filter({trial_part: 'decision'}).last(1).values()[0].explain
				var response = jsPsych.data.get().filter({trial_part: 'cards'}).last(1).values()[0].response
				var type = jsPsych.data.get().filter({trial_part: 'cards'}).last(1).values()[0].set ? 'set' : 'noset'
				return makeHTML({cards: jsPsych.timelineVariable('cards', true), response: response, cards_bg: correct ? 'lawngreen' : 'red',
					explain: explain ? type : 'no', score: score, max_score: trials.length, uid:uid, trial_num:trial_num, next:true})
		    },
			choices: [keychars.next],
			data: { trial_part: 'feedback' },
			on_load: function() {jsPsych.data.get().filter({trial_part: 'cards'}).last(1).values()[0].correct ? audio_correct.play() : audio_wrong.play()}
		}

		var test = {
			timeline: [cards, explanation, feedback],
			timeline_variables: trials
			// conditional_function: !abort  // todo: this should be checked before each trial part

		}

		var winner = {
			type: 'html-keyboard-response',
			stimulus: function() {
				var html = `
					<div style="position:relative;background-color:#ffcc00;height:100vh;width:100vw;display:table-cell;vertical-align:middle">
						<p style="font-size:10vw;margin:0;color:#cc9900">
							¡Ganaste${score > 0 ? ' ' + score + ' punto' : ''}${score > 1 ? 's' : ''}!
						</p>
						<p style="position:absolute;bottom:0;right:10px;margin:0;font-size:2.5vh;line-height:normal">${uid}</p>
					`;
				return html
				},
			on_load: function() {
				audio_win.play()
				saveData()
				// window.removeEventHandler('beforeunload', )
			},
			choices: jsPsych.NO_KEYS,
			data: {}
		}

		var timeline = [fullscreen_on, test, winner]

		function sendData(name, data, async){
			var xhr = new XMLHttpRequest();
			xhr.open('POST', 'http://set.conversodromo.com.ar/write_data.php', async); // 'write_data.php' is the path to the php file described above.
			xhr.setRequestHeader('Content-Type', 'application/json');
			xhr.send(JSON.stringify({filename: name, filedata: data}));
		}


		jsPsych.init({
		    timeline: timeline,
		    on_trial_start: function(trial) {
		    	trial.data.ts_start = Date.now()
		    },
		    on_trial_finish: function(data) {
		    	// var trial_num = data.internal_node_id.split('-').slice(-1)[0].split('.')[1]
		    	data.trial_num = trial_num,
		    	data.ts_end = Date.now()
		    },
		    preload_images: preload_images,
	      	on_interaction_data_update: function(data) {
    			data.ts_start = Date.now(),
    			data.trial_num = trial_num,
    			console.log(JSON.stringify(data))
  			}
		});

    </script>
